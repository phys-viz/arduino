<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sketchbench — Arduino Uploader</title>
<!--
  This is a published, independently-maintained library (not ours) that
  already reliably talks to Uno/Nano-class boards over WebSerial. We use
  it for the actual USB upload step instead of our own hand-rolled
  version, since it's already proven to work correctly on the exact
  board/driver/OS combination this classroom uses.
  https://github.com/dbuezas/arduino-web-uploader
-->
<script src="https://github.com/dbuezas/arduino-web-uploader/releases/download/v1.1.2/main.js"></script>
<style>
  :root {
    --board-green: #0f3d2e;
    --board-green-dark: #0a2b20;
    --pad-copper: #c9922f;
    --pad-copper-bright: #e0ac4a;
    --trace: #1c5940;
    --paper: #f2ede0;
    --ink: #1b1b16;
    --ink-soft: #5b5b4f;
    --console-bg: #0c0f0d;
    --console-text: #d7e9dc;
    --ok: #6fcf97;
    --warn: #e0ac4a;
    --err: #e0705f;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: var(--board-green);
    color: var(--paper);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    border-bottom: 4px solid var(--pad-copper);
    background-image:
      radial-gradient(circle at 12px 12px, var(--pad-copper) 1.5px, transparent 1.6px),
      radial-gradient(circle at 12px 12px, var(--pad-copper) 1.5px, transparent 1.6px);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
    background-repeat: repeat-x;
    background-color: var(--board-green);
  }

  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  header .spacer { flex: 1; }

  select, button {
    font-family: inherit;
    font-size: 14px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    padding: 8px 14px;
    cursor: pointer;
  }

  select {
    background: var(--board-green-dark);
    color: var(--paper);
    border: 1px solid var(--trace);
  }

  button {
    background: var(--pad-copper);
    color: #241a08;
    font-weight: 600;
    transition: background 0.12s ease;
  }
  button:hover:not(:disabled) { background: var(--pad-copper-bright); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  button.secondary {
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--pad-copper);
  }
  button.secondary:hover:not(:disabled) { background: rgba(201, 146, 47, 0.18); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 14px;
    max-width: 980px;
    width: 100%;
    margin: 0 auto;
  }

  .editor-shell {
    border: 1px solid #d8d0bb;
    border-radius: var(--radius);
    overflow: hidden;
    background: #14171a;
    display: flex;
    min-height: 360px;
    flex: 1;
  }

  .line-numbers {
    background: #0f1214;
    color: #5c665e;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 14px;
    line-height: 21px;
    padding: 12px 10px;
    text-align: right;
    user-select: none;
    overflow: hidden;
    white-space: pre;
  }

  textarea#code {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: #14171a;
    color: #e7ede9;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 14px;
    line-height: 21px;
    padding: 12px 14px;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .toolbar .status-chip {
    font-size: 13px;
    color: var(--ink-soft);
    padding: 6px 10px;
    border: 1px solid #d8d0bb;
    border-radius: var(--radius);
    background: #fff;
  }
  .toolbar .status-chip.connected { color: #14663f; border-color: #a9d7bf; background: #eaf7ef; }

  #console {
    background: var(--console-bg);
    color: var(--console-text);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.55;
    border-radius: var(--radius);
    padding: 12px 14px;
    height: 190px;
    overflow-y: auto;
    white-space: pre-wrap;
    border: 1px solid #23281f;
  }
  #console .ok { color: var(--ok); }
  #console .warn { color: var(--warn); }
  #console .err { color: var(--err); }
  #console .muted { color: #6d766f; }

  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 10px 0 18px;
  }

  @media (max-width: 640px) {
    header { padding: 12px 14px; }
    main { padding: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>⚡ Sketchbench</h1>
  <select id="board">
    <option value="uno">Arduino Uno</option>
    <option value="nano_new">Arduino Nano (newer bootloader)</option>
    <option value="nano_old">Arduino Nano (older bootloader)</option>
  </select>
  <div class="spacer"></div>
  <button id="connectBtn" class="secondary">Connect board</button>
</header>

<main>
  <div class="editor-shell">
    <div class="line-numbers" id="lineNumbers">1</div>
    <textarea id="code" spellcheck="false"></textarea>
  </div>

  <div class="toolbar">
    <button id="compileBtn">Compile</button>
    <button id="uploadBtn" disabled>Upload to board</button>
    <span class="status-chip" id="connChip">No board connected</span>
    <span class="status-chip" id="hexChip">Not compiled yet</span>
  </div>

  <!--
    Hidden button that the arduino-web-uploader library auto-wires itself
    to (it scans for the "arduino-uploader" attribute). We set hex-href
    and board on it right before triggering a click programmatically, so
    the actual USB upload goes through their proven code, not ours.
  -->
  <button id="realUploaderBtn" arduino-uploader hex-href="" board="nano" style="display:none">
    <span class="upload-progress"></span>
  </button>

  <div id="console"><span class="muted">Ready. Write a sketch, then Compile, then Connect + Upload.</span></div>
</main>

<footer>Sketchbench — a classroom Arduino uploader · <span id="versionTag">v0.8</span></footer>

<script>
// ---------------------------------------------------------------------
// Point this at wherever the compile server (server/server.js) is running.
// For a classroom LAN this might be your teacher laptop's IP address;
// for a hosted setup it'll be a real URL. This is the ONLY line most
// deployments need to change.
// ---------------------------------------------------------------------
const COMPILE_SERVER_URL = "http://localhost:3131";

const BOARD_BAUD = {
  uno: 115200,
  nano_new: 115200,
  nano_old: 57600,
};

const DEFAULT_SKETCH = `void setup() {
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop() {
  digitalWrite(LED_BUILTIN, HIGH);
  delay(500);
  digitalWrite(LED_BUILTIN, LOW);
  delay(500);
}
`;

// ---------- Editor ----------
const codeEl = document.getElementById("code");
const lineNumbersEl = document.getElementById("lineNumbers");

function refreshLineNumbers() {
  const lines = codeEl.value.split("\n").length;
  let out = "";
  for (let i = 1; i <= lines; i++) out += i + "\n";
  lineNumbersEl.textContent = out;
}
codeEl.addEventListener("input", () => {
  refreshLineNumbers();
  localStorage.setItem("sketchbench_code", codeEl.value);
});
codeEl.addEventListener("scroll", () => {
  lineNumbersEl.scrollTop = codeEl.scrollTop;
});
codeEl.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const start = codeEl.selectionStart, end = codeEl.selectionEnd;
    codeEl.value = codeEl.value.slice(0, start) + "  " + codeEl.value.slice(end);
    codeEl.selectionStart = codeEl.selectionEnd = start + 2;
    refreshLineNumbers();
  }
});

codeEl.value = localStorage.getItem("sketchbench_code") || DEFAULT_SKETCH;
refreshLineNumbers();

const boardSelect = document.getElementById("board");
boardSelect.value = localStorage.getItem("sketchbench_board") || "uno";
boardSelect.addEventListener("change", () => {
  localStorage.setItem("sketchbench_board", boardSelect.value);
});

// ---------- Console log ----------
const consoleEl = document.getElementById("console");
function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  consoleEl.appendChild(line);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}
function clearLog() { consoleEl.innerHTML = ""; }

// Bump this string any time you save a change, so it's obvious whether
// the browser is actually running your latest edit or a stale/cached copy.
const SKETCHBENCH_VERSION = "v0.8";
log(`Sketchbench ${SKETCHBENCH_VERSION} loaded.`, "muted");

// ---------- Compile ----------
const compileBtn = document.getElementById("compileBtn");
const uploadBtn = document.getElementById("uploadBtn");
const hexChip = document.getElementById("hexChip");
let compiledHexText = null; // raw Intel HEX text, exactly as the compiler produced it

compileBtn.addEventListener("click", async () => {
  clearLog();
  compiledHexText = null;
  uploadBtn.disabled = true;
  hexChip.textContent = "Not compiled yet";
  hexChip.classList.remove("connected");
  compileBtn.disabled = true;
  log("Sending sketch to compile server...", "muted");

  try {
    const res = await fetch(`${COMPILE_SERVER_URL}/compile`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: codeEl.value, board: boardSelect.value }),
    });
    const data = await res.json();

    if (!data.success) {
      log("Compile failed:", "err");
      log(data.error || "(no details returned)", "err");
      return;
    }

    compiledHexText = atob(data.hex);
    log(`Compiled OK — ${compiledHexText.length} characters of program data.`, "ok");
    hexChip.textContent = "Compiled — ready to upload";
    hexChip.classList.add("connected");
    uploadBtn.disabled = false;
  } catch (err) {
    log("Couldn't reach the compile server. Is it running, and is " + COMPILE_SERVER_URL + " reachable from this browser?", "err");
    log(String(err), "err");
  } finally {
    compileBtn.disabled = false;
  }
});

// Minimal Intel HEX parser — handles the record types avr-gcc actually
// emits for Uno/Nano-class chips (data + end-of-file). Returns a flat
// byte array representing flash contents starting at address 0.
function parseIntelHex(hexText) {
  const bytes = [];
  const lines = hexText.split(/\r?\n/);
  for (const line of lines) {
    if (!line.startsWith(":")) continue;
    const byteCount = parseInt(line.substr(1, 2), 16);
    const address = parseInt(line.substr(3, 4), 16);
    const recordType = parseInt(line.substr(7, 2), 16);
    if (recordType === 0) {
      for (let i = 0; i < byteCount; i++) {
        const byteStr = line.substr(9 + i * 2, 2);
        bytes[address + i] = parseInt(byteStr, 16);
      }
    }
    // recordType 1 = end of file, others not expected for these boards.
  }
  // Fill any gaps (shouldn't normally happen) with 0xFF.
  for (let i = 0; i < bytes.length; i++) {
    if (bytes[i] === undefined) bytes[i] = 0xff;
  }
  return new Uint8Array(bytes);
}

// ---------- WebSerial connect ----------
const connectBtn = document.getElementById("connectBtn");
const connChip = document.getElementById("connChip");

if (!("serial" in navigator)) {
  connectBtn.disabled = true;
  connChip.textContent = "This browser doesn't support WebSerial — use Chrome or Edge.";
} else {
  connChip.textContent = "Click Upload to pick your board";
}
connectBtn.style.display = "none"; // the library below handles board selection itself, at upload time

// ---------- Upload, via the proven arduino-web-uploader library ----------
// Maps our own board dropdown values to that library's board names.
const LIBRARY_BOARD_NAMES = {
  uno: "uno",
  nano_new: "nano",
  nano_old: "nanoOldBootloader",
};

const realUploaderBtn = document.getElementById("realUploaderBtn");
const progressSpan = realUploaderBtn.querySelector(".upload-progress");

// Mirror the library's own progress text into our console, so the
// person watches one place instead of two.
let lastProgressText = "";
new MutationObserver(() => {
  const text = progressSpan.textContent.trim();
  if (text && text !== lastProgressText) {
    lastProgressText = text;
    log("  " + text, "muted");
  }
}).observe(progressSpan, { childList: true, characterData: true, subtree: true });

uploadBtn.addEventListener("click", () => {
  if (!compiledHexText) return;

  const boardName = LIBRARY_BOARD_NAMES[boardSelect.value];
  const blob = new Blob([compiledHexText], { type: "text/plain" });
  const hexUrl = URL.createObjectURL(blob);

  realUploaderBtn.setAttribute("hex-href", hexUrl);
  realUploaderBtn.setAttribute("board", boardName);

  log("Handing off to the board-selection popup — choose your board there...", "muted");
  log(`  (sending hex-href=${hexUrl}, board=${boardName})`, "muted");
  uploadBtn.disabled = true;
  realUploaderBtn.click();

  // The library doesn't give us a promise to await, so we just re-enable
  // the button after a generous delay — clicking again if still mid-upload
  // simply reopens the picker, it doesn't corrupt anything in progress.
  setTimeout(() => {
    uploadBtn.disabled = !compiledHexText;
  }, 4000);
});
</script>
</body>
</html>
