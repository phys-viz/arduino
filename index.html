<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sketchbench — Arduino Uploader</title>
<!--
  This is a published, independently-maintained library (not ours) that
  already reliably talks to Uno/Nano-class boards over WebSerial. We use
  it for the actual USB upload step instead of our own hand-rolled
  version, since it's already proven to work correctly on the exact
  board/driver/OS combination this classroom uses.
  https://github.com/dbuezas/arduino-web-uploader
-->
<script src="https://github.com/dbuezas/arduino-web-uploader/releases/download/v1.1.2/main.js"></script>
<style>
  :root {
    --board-green: #0f3d2e;
    --board-green-dark: #0a2b20;
    --pad-copper: #c9922f;
    --pad-copper-bright: #e0ac4a;
    --trace: #1c5940;
    --paper: #f2ede0;
    --surface: #fff;
    --ink: #1b1b16;
    --ink-soft: #5b5b4f;
    --border: #e2dbc8;
    --console-bg: #0d1210;
    --console-text: #d7e9dc;
    --ok: #6fcf97;
    --warn: #e0ac4a;
    --err: #e0705f;
    --radius: 10px;
    --radius-sm: 7px;
    --shadow: 0 1px 2px rgba(20, 20, 10, 0.04), 0 6px 20px rgba(20, 20, 10, 0.07);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Fixed-height app shell: header/toolbar/footer stay put, and the
     editor + console scroll internally instead of growing the whole
     page. min-height:0 on the flex children below is what makes that
     work — without it, flexbox lets content overflow instead of
     scrolling. */
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    background: var(--board-green);
    color: var(--paper);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    box-shadow: 0 2px 0 var(--pad-copper), 0 4px 16px rgba(10, 30, 20, 0.25);
    background-image:
      radial-gradient(circle at 12px 12px, var(--pad-copper) 1.5px, transparent 1.6px),
      radial-gradient(circle at 12px 12px, var(--pad-copper) 1.5px, transparent 1.6px);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
    background-repeat: repeat-x;
    background-color: var(--board-green);
    z-index: 1;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 17px;
    font-weight: 650;
    margin: 0;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  header .spacer { flex: 1; }

  select, button {
    font-family: inherit;
    font-size: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    padding: 9px 16px;
    cursor: pointer;
  }

  select {
    background: var(--board-green-dark);
    color: var(--paper);
    border: 1px solid var(--trace);
  }

  button {
    background: var(--pad-copper);
    color: #241a08;
    font-weight: 600;
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  button:hover:not(:disabled) {
    background: var(--pad-copper-bright);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(201, 146, 47, 0.35);
  }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  button.secondary {
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--pad-copper);
  }
  button.secondary:hover:not(:disabled) { background: rgba(201, 146, 47, 0.18); box-shadow: none; }

  button.quiet {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border);
  }
  button.quiet:hover:not(:disabled) {
    background: #faf7ef;
    box-shadow: var(--shadow);
  }

  main {
    flex: 1;
    min-height: 0; /* lets children scroll instead of overflowing the page */
    display: flex;
    flex-direction: column;
    padding: 20px 20px 16px;
    gap: 14px;
    max-width: 980px;
    width: 100%;
    margin: 0 auto;
  }

  .editor-shell {
    border: 1px solid #2a2f2a;
    border-radius: var(--radius);
    overflow: hidden;
    background: #14171a;
    display: flex;
    flex: 1;
    min-height: 0; /* the actual fix: allows the textarea to scroll internally */
    box-shadow: var(--shadow);
  }

  .line-numbers {
    background: #0f1214;
    color: #5c665e;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 14px;
    line-height: 21px;
    padding: 14px 10px;
    text-align: right;
    user-select: none;
    overflow: hidden;
    white-space: pre;
  }

  textarea#code {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: #14171a;
    color: #e7ede9;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 14px;
    line-height: 21px;
    padding: 14px;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .toolbar .status-chip {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 7px 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  .toolbar .status-chip.connected { color: #14663f; border-color: #a9d7bf; background: #eaf7ef; }

  #console {
    background: var(--console-bg);
    color: var(--console-text);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    border-radius: var(--radius);
    padding: 13px 15px;
    height: 170px;
    flex-shrink: 0;
    overflow-y: auto;
    white-space: pre-wrap;
    border: 1px solid #23281f;
    box-shadow: var(--shadow);
  }
  #console .ok { color: var(--ok); }
  #console .warn { color: var(--warn); }
  #console .err { color: var(--err); }
  #console .muted { color: #6d766f; }

  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 8px 0 12px;
    flex-shrink: 0;
  }

  @media (max-width: 640px) {
    header { padding: 12px 14px; }
    main { padding: 14px 14px 10px; }
  }

  /* ---------- Serial Monitor overlay ---------- */
  .monitor-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 15, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 24px;
  }

  .monitor-panel {
    background: var(--console-bg);
    border: 1px solid #23281f;
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    width: 100%;
    max-width: 760px;
    height: 100%;
    max-height: 560px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .monitor-header {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 12px 14px;
    border-bottom: 1px solid #23281f;
    color: var(--console-text);
    flex-shrink: 0;
  }
  .monitor-header .spacer { flex: 1; }
  .monitor-header select {
    background: #1a1f1c;
    color: var(--console-text);
    border: 1px solid #2e3630;
    font-size: 13px;
    padding: 6px 10px;
  }
  .monitor-header button {
    font-size: 13px;
    padding: 7px 12px;
  }
  .monitor-hint {
    font-size: 11.5px;
    color: #7a8378;
  }

  .monitor-output {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--console-text);
    white-space: pre-wrap;
  }
  .monitor-output .line-err { color: var(--err); }

  .monitor-send-row {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid #23281f;
    flex-shrink: 0;
  }
  .monitor-send-row input {
    flex: 1;
    background: #1a1f1c;
    color: var(--console-text);
    border: 1px solid #2e3630;
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 13px;
    outline: none;
  }
  .monitor-send-row input:disabled { opacity: 0.5; }
</style>
</head>
<body>

<header>
  <h1>⚡ Sketchbench</h1>
  <select id="board">
    <option value="uno">Arduino Uno</option>
    <option value="nano_new">Arduino Nano (newer bootloader)</option>
    <option value="nano_old">Arduino Nano (older bootloader)</option>
  </select>
  <div class="spacer"></div>
  <button id="connectBtn" class="secondary">Connect board</button>
</header>

<main>
  <div class="editor-shell">
    <div class="line-numbers" id="lineNumbers">1</div>
    <textarea id="code" spellcheck="false"></textarea>
  </div>

  <div class="toolbar">
    <button id="compileBtn">Compile</button>
    <button id="uploadBtn" disabled>Upload to board</button>
    <button id="saveBtn" class="quiet">Save .ino</button>
    <button id="loadBtn" class="quiet">Load .ino</button>
    <button id="monitorToggleBtn" class="quiet">Serial Monitor</button>
    <input type="file" id="loadFileInput" accept=".ino,.txt,text/plain" style="display:none" />
    <span class="status-chip" id="connChip">No board connected</span>
    <span class="status-chip" id="hexChip">Not compiled yet</span>
  </div>

  <!--
    Hidden button that the arduino-web-uploader library auto-wires itself
    to (it scans for the "arduino-uploader" attribute). We set hex-href
    and board on it right before triggering a click programmatically, so
    the actual USB upload goes through their proven code, not ours.
  -->
  <button id="realUploaderBtn" arduino-uploader hex-href="" board="nano" style="display:none">
    <span class="upload-progress"></span>
  </button>

  <div id="console"><span class="muted">Ready. Write a sketch, then Compile, then Connect + Upload.</span></div>
</main>

<!--
  Serial Monitor — a separate, independent WebSerial connection from the
  Upload flow above. Only one thing can hold a board's serial port at a
  time, so this and Upload can't both be connected at once — closing one
  frees the port for the other.
-->
<div id="monitorOverlay" class="monitor-overlay" style="display:none">
  <div class="monitor-panel">
    <div class="monitor-header">
      <strong>Serial Monitor</strong>
      <select id="monitorBaud">
        <option value="9600" selected>9600 baud</option>
        <option value="115200">115200 baud</option>
        <option value="57600">57600 baud</option>
        <option value="38400">38400 baud</option>
        <option value="19200">19200 baud</option>
        <option value="4800">4800 baud</option>
      </select>
      <span class="monitor-hint">Baud rate must match the Serial.begin(...) in your sketch.</span>
      <div class="spacer"></div>
      <button id="monitorConnectBtn" class="quiet">Connect</button>
      <button id="monitorClearBtn" class="quiet">Clear</button>
      <button id="monitorSaveBtn" class="quiet">Save log</button>
      <button id="monitorCloseBtn" class="quiet">Close</button>
    </div>
    <div id="monitorOutput" class="monitor-output"></div>
    <div class="monitor-send-row">
      <input type="text" id="monitorSendInput" placeholder="Type something to send to the board, then press Enter..." disabled />
      <button id="monitorSendBtn" disabled>Send</button>
    </div>
  </div>
</div>

<footer>Sketchbench — a classroom Arduino uploader · <span id="versionTag">v0.16</span></footer>

<script>
// ---------------------------------------------------------------------
// Point this at wherever the compile server (server/server.js) is running.
// For a classroom LAN this might be your teacher laptop's IP address;
// for a hosted setup it'll be a real URL. This is the ONLY line most
// deployments need to change.
// ---------------------------------------------------------------------
const COMPILE_SERVER_URL = "https://gristle-bronco-saturate.ngrok-free.dev";

const BOARD_BAUD = {
  uno: 115200,
  nano_new: 115200,
  nano_old: 57600,
};

const DEFAULT_SKETCH = `void setup() {
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop() {
  digitalWrite(LED_BUILTIN, HIGH);
  delay(500);
  digitalWrite(LED_BUILTIN, LOW);
  delay(500);
}
`;

// ---------- Editor ----------
const codeEl = document.getElementById("code");
const lineNumbersEl = document.getElementById("lineNumbers");

function refreshLineNumbers() {
  const lines = codeEl.value.split("\n").length;
  let out = "";
  for (let i = 1; i <= lines; i++) out += i + "\n";
  lineNumbersEl.textContent = out;
}
codeEl.addEventListener("input", () => {
  refreshLineNumbers();
  localStorage.setItem("sketchbench_code", codeEl.value);
});
codeEl.addEventListener("scroll", () => {
  lineNumbersEl.scrollTop = codeEl.scrollTop;
});
codeEl.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const start = codeEl.selectionStart, end = codeEl.selectionEnd;
    codeEl.value = codeEl.value.slice(0, start) + "  " + codeEl.value.slice(end);
    codeEl.selectionStart = codeEl.selectionEnd = start + 2;
    refreshLineNumbers();
  }
});

codeEl.value = localStorage.getItem("sketchbench_code") || DEFAULT_SKETCH;
refreshLineNumbers();

const boardSelect = document.getElementById("board");
boardSelect.value = localStorage.getItem("sketchbench_board") || "uno";
boardSelect.addEventListener("change", () => {
  localStorage.setItem("sketchbench_board", boardSelect.value);
});

// ---------- Console log ----------
const consoleEl = document.getElementById("console");
function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  consoleEl.appendChild(line);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}
function clearLog() { consoleEl.innerHTML = ""; }

// Bump this string any time you save a change, so it's obvious whether
// the browser is actually running your latest edit or a stale/cached copy.
const SKETCHBENCH_VERSION = "v0.16";
log(`Sketchbench ${SKETCHBENCH_VERSION} loaded.`, "muted");

// ---------- Compile ----------
const compileBtn = document.getElementById("compileBtn");
const uploadBtn = document.getElementById("uploadBtn");
const hexChip = document.getElementById("hexChip");
let compiledHexText = null; // raw Intel HEX text, exactly as the compiler produced it

// ---------- Save .ino ----------
// Uses Chrome's real "Save As" dialog when available (lets the student
// pick folder + filename, including Google Drive on ChromeOS), falling
// back to a plain auto-download for any browser/context where that
// isn't supported.
document.getElementById("saveBtn").addEventListener("click", async () => {
  const text = codeEl.value;

  if ("showSaveFilePicker" in window) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "sketch.ino",
        types: [{ description: "Arduino sketch", accept: { "text/plain": [".ino"] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      return;
    } catch (err) {
      if (err.name === "AbortError") return; // student clicked Cancel — not an error
      // any other failure: fall through to the plain download below
    }
  }

  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "sketch.ino";
  a.click();
  URL.revokeObjectURL(url);
});

// ---------- Load .ino ----------
// Same idea as Save, in reverse: use the real "Open" dialog when
// available, otherwise fall back to a plain file-picker input (which
// works everywhere, just with the browser's default look rather than a
// native-feeling dialog).
function loadCodeIntoEditor(text) {
  codeEl.value = text;
  refreshLineNumbers();
  localStorage.setItem("sketchbench_code", codeEl.value);
}

document.getElementById("loadBtn").addEventListener("click", async () => {
  if ("showOpenFilePicker" in window) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "Arduino sketch", accept: { "text/plain": [".ino", ".txt"] } }],
      });
      const file = await handle.getFile();
      loadCodeIntoEditor(await file.text());
      return;
    } catch (err) {
      if (err.name === "AbortError") return; // student clicked Cancel — not an error
      // any other failure: fall through to the plain file input below
    }
  }
  document.getElementById("loadFileInput").click();
});

document.getElementById("loadFileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  loadCodeIntoEditor(await file.text());
  e.target.value = ""; // so picking the same file again still fires "change"
});

compileBtn.addEventListener("click", async () => {
  clearLog();
  compiledHexText = null;
  uploadBtn.disabled = true;
  hexChip.textContent = "Not compiled yet";
  hexChip.classList.remove("connected");
  compileBtn.disabled = true;
  log("Sending sketch to compile server...", "muted");

  try {
    const res = await fetch(`${COMPILE_SERVER_URL}/compile`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: codeEl.value, board: boardSelect.value }),
    });
    const data = await res.json();

    if (!data.success) {
      log("Compile failed:", "err");
      log(data.error || "(no details returned)", "err");
      return;
    }

    compiledHexText = atob(data.hex);
    log(`Compiled OK — ${compiledHexText.length} characters of program data.`, "ok");
    hexChip.textContent = "Compiled — ready to upload";
    hexChip.classList.add("connected");
    uploadBtn.disabled = false;
  } catch (err) {
    log("Couldn't reach the compile server. Is it running, and is " + COMPILE_SERVER_URL + " reachable from this browser?", "err");
    log(String(err), "err");
  } finally {
    compileBtn.disabled = false;
  }
});

// Minimal Intel HEX parser — handles the record types avr-gcc actually
// emits for Uno/Nano-class chips (data + end-of-file). Returns a flat
// byte array representing flash contents starting at address 0.
function parseIntelHex(hexText) {
  const bytes = [];
  const lines = hexText.split(/\r?\n/);
  for (const line of lines) {
    if (!line.startsWith(":")) continue;
    const byteCount = parseInt(line.substr(1, 2), 16);
    const address = parseInt(line.substr(3, 4), 16);
    const recordType = parseInt(line.substr(7, 2), 16);
    if (recordType === 0) {
      for (let i = 0; i < byteCount; i++) {
        const byteStr = line.substr(9 + i * 2, 2);
        bytes[address + i] = parseInt(byteStr, 16);
      }
    }
    // recordType 1 = end of file, others not expected for these boards.
  }
  // Fill any gaps (shouldn't normally happen) with 0xFF.
  for (let i = 0; i < bytes.length; i++) {
    if (bytes[i] === undefined) bytes[i] = 0xff;
  }
  return new Uint8Array(bytes);
}

// ---------- WebSerial connect ----------
const connectBtn = document.getElementById("connectBtn");
const connChip = document.getElementById("connChip");

if (!("serial" in navigator)) {
  connectBtn.disabled = true;
  connChip.textContent = "This browser doesn't support WebSerial — use Chrome or Edge.";
} else {
  connChip.textContent = "Click Upload to pick your board";
}
connectBtn.style.display = "none"; // the library below handles board selection itself, at upload time

// ---------- Upload, via the proven arduino-web-uploader library ----------
// Maps our own board dropdown values to that library's board names.
const LIBRARY_BOARD_NAMES = {
  uno: "uno",
  nano_new: "nano",
  nano_old: "nanoOldBootloader",
};

const realUploaderBtn = document.getElementById("realUploaderBtn");
const progressSpan = realUploaderBtn.querySelector(".upload-progress");

// Mirror the library's own progress text into our console. Note: we
// can't auto-retry by having code click the button again — Chrome only
// allows the board-picker popup to appear right after a real, physical
// click from a person, never from code running on a timer. So on
// failure we ask the person to click Upload again themselves, which
// still counts as a fresh, valid click.
let lastProgressText = "";
let retryCount = 0;
const MAX_RETRIES = 4;

new MutationObserver(() => {
  // Deferred with setTimeout(..., 0) on purpose: this observer fires
  // exactly when the board's serial data is being handled, which is
  // timing-sensitive (400ms timeouts internally). Doing our own DOM
  // work (appending log lines, scrolling) immediately, in the same
  // synchronous moment, could delay that handling just enough to cause
  // a timeout. Pushing it to the next tick keeps our UI updates from
  // ever competing with the time-critical part.
  setTimeout(() => {
    const text = progressSpan.textContent.trim();
    if (text && text !== lastProgressText) {
      lastProgressText = text;
      log("  " + text, "muted");

      if (text.startsWith("Error") && retryCount < MAX_RETRIES) {
        retryCount++;
        log(`  Hiccup on this attempt (${retryCount}/${MAX_RETRIES}) — this board's connection is a little flaky sometimes. Click Upload again to retry.`, "warn");
        uploadBtn.disabled = !compiledHexText;
      } else if (text.startsWith("Error")) {
        log("Upload kept failing after several attempts. Try unplugging and replugging the board, then Upload again.", "err");
        uploadBtn.disabled = !compiledHexText;
      } else if (text === "100%" || text.toLowerCase().includes("done")) {
        log("Upload complete. The board should be running your new sketch now.", "ok");
        uploadBtn.disabled = !compiledHexText;
      }
    }
  }, 0);
}).observe(progressSpan, { childList: true, characterData: true, subtree: true });

uploadBtn.addEventListener("click", () => {
  if (!compiledHexText) return;

  retryCount = 0;
  lastProgressText = "";
  const boardName = LIBRARY_BOARD_NAMES[boardSelect.value];
  const blob = new Blob([compiledHexText], { type: "text/plain" });
  const hexUrl = URL.createObjectURL(blob);

  realUploaderBtn.setAttribute("hex-href", hexUrl);
  realUploaderBtn.setAttribute("board", boardName);

  log("Handing off to the board-selection popup — choose your board there...", "muted");
  log(`  (sending hex-href=${hexUrl}, board=${boardName})`, "muted");
  uploadBtn.disabled = true;
  realUploaderBtn.click();
});

// ---------- Serial Monitor ----------
// A separate, independent WebSerial connection from the Upload flow
// above — deliberately simple, since a monitor only needs to open the
// port and read/write plain bytes, with none of the bootloader
// handshake Upload requires. Only one thing can hold the port at a
// time, so this and Upload can't be connected simultaneously.
const monitorOverlay = document.getElementById("monitorOverlay");
const monitorOutput = document.getElementById("monitorOutput");
const monitorBaud = document.getElementById("monitorBaud");
const monitorConnectBtn = document.getElementById("monitorConnectBtn");
const monitorSendInput = document.getElementById("monitorSendInput");
const monitorSendBtn = document.getElementById("monitorSendBtn");

let monitorPort = null;
let monitorReader = null;
let monitorKeepReading = false;
let monitorLines = [];

function pad2(n) { return String(n).padStart(2, "0"); }

function appendMonitorLine(text, isError) {
  const now = new Date();
  const stamp = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  const fullLine = `[${stamp}] ${text}`;
  monitorLines.push(fullLine);

  const nearBottom = monitorOutput.scrollHeight - monitorOutput.scrollTop - monitorOutput.clientHeight < 40;
  const div = document.createElement("div");
  if (isError) div.className = "line-err";
  div.textContent = fullLine;
  monitorOutput.appendChild(div);
  if (nearBottom) monitorOutput.scrollTop = monitorOutput.scrollHeight;
}

async function startMonitor() {
  try {
    monitorPort = await navigator.serial.requestPort();
    await monitorPort.open({ baudRate: parseInt(monitorBaud.value, 10) });
  } catch (err) {
    if (err.name !== "AbortError") appendMonitorLine(`Couldn't open the board: ${err.message}`, true);
    monitorPort = null;
    return;
  }

  monitorKeepReading = true;
  monitorReader = monitorPort.readable.getReader();
  monitorConnectBtn.textContent = "Disconnect";
  monitorBaud.disabled = true;
  monitorSendInput.disabled = false;
  monitorSendBtn.disabled = false;
  appendMonitorLine("— connected —");

  const decoder = new TextDecoder();
  let lineBuffer = "";
  try {
    while (monitorKeepReading) {
      const { value, done } = await monitorReader.read();
      if (done) break;
      if (!value) continue;
      lineBuffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = lineBuffer.indexOf("\n")) >= 0) {
        appendMonitorLine(lineBuffer.slice(0, idx).replace(/\r$/, ""));
        lineBuffer = lineBuffer.slice(idx + 1);
      }
    }
  } catch (err) {
    if (monitorKeepReading) appendMonitorLine(`Connection lost: ${err.message}`, true);
  }
}

async function stopMonitor() {
  monitorKeepReading = false;
  try { await monitorReader.cancel(); } catch (e) {}
  try { monitorReader.releaseLock(); } catch (e) {}
  try { await monitorPort.close(); } catch (e) {}
  monitorPort = null;
  monitorReader = null;
  monitorConnectBtn.textContent = "Connect";
  monitorBaud.disabled = false;
  monitorSendInput.disabled = true;
  monitorSendBtn.disabled = true;
  appendMonitorLine("— disconnected —");
}

monitorConnectBtn.addEventListener("click", () => {
  if (monitorPort) stopMonitor(); else startMonitor();
});

async function sendMonitorInput() {
  if (!monitorPort || !monitorSendInput.value) return;
  const writer = monitorPort.writable.getWriter();
  await writer.write(new TextEncoder().encode(monitorSendInput.value + "\n"));
  writer.releaseLock();
  monitorSendInput.value = "";
}
monitorSendBtn.addEventListener("click", sendMonitorInput);
monitorSendInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMonitorInput();
});

document.getElementById("monitorClearBtn").addEventListener("click", () => {
  monitorLines = [];
  monitorOutput.innerHTML = "";
});

document.getElementById("monitorSaveBtn").addEventListener("click", async () => {
  const text = monitorLines.join("\n");
  if ("showSaveFilePicker" in window) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "serial-log.txt",
        types: [{ description: "Text file", accept: { "text/plain": [".txt"] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      return;
    } catch (err) {
      if (err.name === "AbortError") return;
    }
  }
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "serial-log.txt";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("monitorToggleBtn").addEventListener("click", () => {
  monitorOverlay.style.display = "flex";
});

document.getElementById("monitorCloseBtn").addEventListener("click", async () => {
  if (monitorPort) await stopMonitor();
  monitorOverlay.style.display = "none";
});
</script>
</body>
</html>
